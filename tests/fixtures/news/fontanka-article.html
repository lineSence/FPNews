<html><head><meta property="og:title" content="Льготы для избранных. Чиновники вновь реформируют ипотечные кредиты для семей с детьми"/><meta property="og:description" content="Всего неделю отвели власти на подготовку отмены льготной ипотеки в ее нынешнем виде."/><script type="application/ld+json">{"@context": "http://schema.org", "@graph": [{"@type": "Article", "@id": "https://www.fontanka.ru/2026/09/24/76660763/#articleBody", "url": "https://www.fontanka.ru/2026/09/24/76660763/", "headline": "Льготы для избранных. Чиновники вновь реформируют ипотечные кредиты для семей с детьми", "author": {"@type": "Person", "name": "Денис Лебедев ", "url": "https://www.fontanka.ru/authors/lebedev-denis-id26025/"}, "datePublished": "2026-09-24T20:52:00+03:00", "image": ["https://www.fontanka.ru/html-to-img/og/zs0OTiDWXGGPWxc1n5XRAg/article-id7316910-16x9.jpg?1790274571"], "articleBody": "Всего неделю отвели власти на подготовку отмены льготной ипотеки в ее нынешнем виде. Всего неделя есть у семей с детьми на то, чтобы взять кредит на квартиру под 6%. С 1 октября эта цифра станет недоступна для 95% родителей. Зато оставшиеся получат 4, а кто-то и 2%. Так теперь будет работать льготная ипотека.\nИными словами, серьезные льготы, лучше, чем нынешние «плоские» 6%, получают только семьи с четырьмя и более детьми и то только за пределами четырех столичных регионов. Москва, Подмосковье, Петербург и Ленобласть даже для нынешних 6% потребуют четверых детей. Многодетные с тремя&nbsp;в столицах&nbsp;— это уже 8%.\nТем, кто не желает «улучшать демографию» и может похвастаться только двумя или одним ребенком, теперь полагается 8-12% в зависимости от региона.\nЭто все еще лучше, чем «рыночные» 18%, которые банки в среднем по стране дают на новостройки тем, у кого нет никаких льгот. Но теперь позволить себе семейную ипотеку смогут гораздо меньшее количество семей&nbsp;— ежемесячный платеж для них существенно возрастает.\nНу и нет нужды говорить, что обозначенные в обновленной программе лимиты все еще не позволяют купить серьезную большую квартиру для семьи с тремя детьми. Не говоря уж"}, {"@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "item": {"@id": "https://www.fontanka.ru/business/", "name": "Бизнес"}}, {"@type": "ListItem", "position": 2, "item": {"@id": "https://www.fontanka.ru/2026/09/24/76660763/", "name": "Льготы для избранных. Чиновники вновь реформируют ипотечные кредиты для семей с детьми"}}]}]}</script></head><body><p>Абзац страницы, которого нет в разметке для поисковиков.Абзац страницы, которого нет в разметке для поисковиков.Абзац страницы, которого нет в разметке для поисковиков.</p></body></html>
